# aho-video-render — CF Worker + Container (Phase 4 4a-container)
#
# Single deployable: the Container class lives inside the Worker
# bundle as a Durable Object. `wrangler deploy` builds the Docker
# image, pushes it to CF's registry, and deploys the Worker + DO +
# Container binding atomically.
#
# Required platform tier: Workers Paid plan ($5/mo base).
# Cloudflare Containers is GA on Workers Paid as of 2026.

name = "aho-video-render"
main = "src/index.ts"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]

# ─── Container ───────────────────────────────────────────────────
# Builds from ./Dockerfile and binds the resulting image to the
# `VideoRenderContainer` Durable Object class declared in src/index.ts.
# `getContainer(env.VIDEO_RENDER, id)` in the Worker resolves to a
# specific container instance keyed by `id`.
[[containers]]
class_name = "VideoRenderContainer"
image = "./Dockerfile"
max_instances = 4              # cap until usage data justifies scaling
instance_type = "standard"     # 2 vCPU + 4GB RAM — minimum for Chromium + Remotion

# ─── Durable Object binding ─────────────────────────────────────
# The Container class IS a Durable Object. The Worker binds to its
# namespace via `env.VIDEO_RENDER`.
[[durable_objects.bindings]]
name = "VIDEO_RENDER"
class_name = "VideoRenderContainer"

# ─── DO migrations ────────────────────────────────────────────────
# First-deploy migration: tell CF that `VideoRenderContainer` is a
# new SQLite-backed Durable Object class. Required by the platform —
# without it, the deploy errors with "no migration tag for class".
[[migrations]]
tag = "v1"
new_sqlite_classes = ["VideoRenderContainer"]

# ─── Queue consumer ──────────────────────────────────────────────
[[queues.consumers]]
queue = "video-gen"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 3
dead_letter_queue = "video-gen-dlq"

# ─── R2 bucket binding (used inside the container via S3 SDK) ────
[[r2_buckets]]
binding = "AHO_AUDIT_VIDEOS_R2"
bucket_name = "aho-audit-videos"

# ─── Vars (non-secret) ───────────────────────────────────────────
[vars]
AHO_VIDEO_CDN_BASE = "https://videos.advertisehomes.online"
AHO_R2_BUCKET = "aho-audit-videos"

# ─── Secrets (set via `wrangler secret put`) ─────────────────────
# Required:
#   SUPABASE_URL
#   SUPABASE_SERVICE_ROLE_KEY
#   AHO_R2_ENDPOINT
#   AHO_R2_ACCESS_KEY_ID
#   AHO_R2_SECRET_ACCESS_KEY

# ─── Observability ───────────────────────────────────────────────
[observability]
enabled = true
