name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]

# A failed CI run shouldn't block a hot-fix deploy, so this workflow doesn't
# `needs:` the ci workflow — but a typecheck step here serves as a final
# safety gate before we ship the build.
permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: build · deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        # Version is read from package.json `packageManager` field;
        # specifying it here too triggers ERR_PNPM_BAD_PM_VERSION.
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # Build for Cloudflare Pages. NEXT_PUBLIC_* env vars are baked into
      # the client bundle at this step, so they must be present here.
      # Server-only secrets (SUPABASE_SERVICE_ROLE_KEY, STRIPE_*) live as
      # runtime bindings on the Pages project itself, not here.
      - name: Build (next-on-pages)
        run: pnpm pages:build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          NEXT_PUBLIC_R2_PUBLIC_URL: ${{ secrets.NEXT_PUBLIC_R2_PUBLIC_URL }}
          # Cloudflare Images account hash. Not a secret — it appears in
          # every imagedelivery.net URL the client renders. Hardcoding
          # avoids one more GH repo secret to maintain.
          NEXT_PUBLIC_CF_IMAGES_HASH: Sl-ceWby0IYMRC5pXgwVxg

      # Trim non-runtime build artifacts before wrangler uploads. The
      # `nop-build-log.json` is ~1.6 MiB of next-on-pages diagnostic
      # JSON that gets emitted into `_worker.js/` but isn't read by the
      # runtime — Cloudflare's Worker size-limit (3 MiB compressed on
      # the free tier) counts everything in the worker dir, so dropping
      # this file alone can swing several hundred KiB compressed.
      # Logged 2026-05-06 after the cbe6ec6 deploy failed with
      # "Your Worker exceeded the size limit of 3 MiB".
      - name: Trim non-runtime build artifacts
        run: |
          rm -f .vercel/output/static/_worker.js/nop-build-log.json
          echo "Trimmed worker bundle:"
          du -sh .vercel/output/static/_worker.js || true

      # next-on-pages copies most public/* files to the output but
      # `_headers` + `_redirects` are Cloudflare-Pages-specific config
      # files that the next-on-pages build pipeline doesn't always
      # forward (depends on the version + the Vercel output spec
      # interpretation). Explicit copy guarantees they land at the
      # deploy-output root where Pages reads them.
      # Symptom that surfaced 2026-05-16: Lighthouse Best Practices
      # dropped 96 → 73 because the CSP / HSTS / COOP / XFO headers
      # never reached production — public/_headers was in the commit
      # but missing from the deployed dir.
      - name: Copy _headers + _redirects into deploy root
        run: |
          for f in _headers _redirects; do
            if [ -f "public/$f" ] && [ ! -f ".vercel/output/static/$f" ]; then
              cp "public/$f" ".vercel/output/static/$f"
              echo "Copied public/$f → .vercel/output/static/$f"
            fi
          done

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .vercel/output/static --project-name=aho-web --branch=main
