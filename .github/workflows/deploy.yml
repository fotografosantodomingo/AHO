name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]

# A failed CI run shouldn't block a hot-fix deploy, so this workflow doesn't
# `needs:` the ci workflow — but a typecheck step here serves as a final
# safety gate before we ship the build.
permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: build · deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        # Version is read from package.json `packageManager` field;
        # specifying it here too triggers ERR_PNPM_BAD_PM_VERSION.
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # Build for Cloudflare Pages. NEXT_PUBLIC_* env vars are baked into
      # the client bundle at this step, so they must be present here.
      # Server-only secrets (SUPABASE_SERVICE_ROLE_KEY, STRIPE_*) live as
      # runtime bindings on the Pages project itself, not here.
      - name: Build (next-on-pages)
        run: pnpm pages:build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .vercel/output/static --project-name=aho-web --branch=main
