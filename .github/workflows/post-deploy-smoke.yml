name: Post-deploy smoke

# Runs AFTER the Deploy workflow completes successfully on main.
# Hits a curated set of production endpoints + asserts the responses
# look right. Fails the workflow run if anything's broken — gives us
# the GitHub email + red badge we'd otherwise discover via QA hours
# later (the way the 2026-05-17 ImageResponse breakage + missing
# CRON_SECRET both went unnoticed for the full day).
#
# This catches the classes of bugs that the local pre-push hook
# CAN'T catch:
#   - Build / bundle regressions that only manifest in the Cloudflare
#     Pages output (Edge runtime tree-shaking, satori loader breakage)
#   - Missing env vars in the deployed environment
#   - Cloudflare-side cache or routing issues
#   - Third-party API rot (Meta, LinkedIn, Anthropic)

on:
  workflow_run:
    workflows: ['Deploy to Cloudflare Pages']
    types:
      - completed
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    name: smoke prod
    # Only run when the upstream Deploy actually succeeded; on failure
    # there's nothing to smoke-test.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      BASE: https://advertisehomes.online
      # CRON_SECRET is needed to assert the cron auth gate works.
      # Stored as a GitHub Actions secret with the same value as the
      # CF Pages env var of the same name.
      CRON_SECRET: ${{ secrets.CRON_SECRET }}

    steps:
      - name: Wait for CDN propagation (homepage poll)
        # Cloudflare Pages reports success the instant the upload
        # finishes; edge propagation lags ~10-30s and varies per
        # PoP. Instead of a flat sleep, poll the homepage until
        # we see the AHO wordmark — guarantees the new bundle is
        # serving before we assert anything else. Max 90s, then
        # fail fast.
        #
        # IMPLEMENTATION NOTE — do NOT use `echo "$body" | grep -q`.
        # The homepage body is ~200 KB; grep matches in the first KB
        # and closes the pipe; echo gets SIGPIPE (exit 141); with
        # `set -o pipefail` the pipeline returns 141 → the if branch
        # never fires even when the wordmark IS present. The whole
        # 90s budget burned silently and the step error'd with
        # "homepage didn't propagate within 90s" while the page was
        # actually serving correctly. Bash native string match
        # `[[ "$body" == *AHO* ]]` is fork-free and SIGPIPE-immune.
        # Logged 2026-05-18 after 5 consecutive false-failure runs.
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 18); do
            body=$(curl -sf "$BASE/en" || echo "")
            if [[ "$body" == *AHO* ]]; then
              echo "✓ homepage ready after $((i*5))s wait"
              exit 0
            fi
            sleep 5
          done
          echo "::error::homepage didn't propagate within 90s"
          exit 1

      - name: Assert /en/for-agents loads (Free Audit wedge)
        shell: bash
        run: |
          set -euo pipefail
          body=$(curl -sf "$BASE/en/for-agents")
          # The widget label varies by copy revision — match a
          # robust substring instead of the full button text. Use
          # bash regex (not `echo | grep`) to dodge the SIGPIPE /
          # pipefail trap explained on the homepage step above.
          if [[ ! "$body" =~ (audit|campaign|paste) ]]; then
            echo "::error::/for-agents missing wedge widget content"
            exit 1
          fi
          echo "✓ /for-agents loads + has wedge widget"

      - name: Assert /en/investors loads (fundraise toolkit)
        run: |
          set -euo pipefail
          status=$(curl -s -o /dev/null -w "%{http_code}" "$BASE/en/investors")
          [ "$status" = "200" ] || { echo "::error::/en/investors returned $status (expected 200)"; exit 1; }
          echo "✓ /investors HTTP 200"

      - name: Assert dashboard auth gate (anon → 307 to /signin)
        shell: bash
        run: |
          set -euo pipefail
          # No -L; we want to see the redirect itself
          status=$(curl -s -o /dev/null -w "%{http_code}" "$BASE/en/dashboard")
          # Capture the Location header via curl -w to avoid the
          # `curl -sI | grep -i location` pipe, which can SIGPIPE
          # the curl half under pipefail. -D - prints headers to
          # stdout; we slice with bash native parameter expansion.
          headers=$(curl -sI "$BASE/en/dashboard")
          loc=""
          while IFS= read -r line; do
            if [[ "${line,,}" == location:* ]]; then
              loc=$(echo "${line#*:}" | tr -d '\r' | xargs)
              break
            fi
          done <<< "$headers"
          [ "$status" = "307" ] || { echo "::error::dashboard returned $status (expected 307)"; exit 1; }
          if [[ "$loc" != *"/en/signin"* ]]; then
            echo "::error::dashboard redirected to '$loc' (expected to contain /en/signin)"
            exit 1
          fi
          echo "✓ /en/dashboard 307 → /en/signin (auth gate intact)"

      - name: Assert JSON-LD present and parseable on homepage + a listing-like surface
        # Catches regressions where a refactor accidentally drops the
        # <script type="application/ld+json"> tag from a page. Asserts:
        #   (1) the page emits at least one JSON-LD script (the
        #       site-wide Organization + WebSite from layout)
        #   (2) the bytes between the script's open + close tags parse
        #       as JSON (catches truncation, accidental string drift,
        #       missing `serializeJsonLd` escape).
        # /en/for-agents is a higher-value test surface than the home
        # because it carries the Service + Product + FAQPage graph;
        # if that page's @graph breaks, marketing rich-results die.
        #
        # IMPLEMENTATION NOTE — the JSON-LD extraction + parse runs
        # via `python3 -c` reading the HTML from a file, NOT a heredoc.
        # Heredocs inside YAML's `run: |` block carry the YAML indent
        # as part of stdin, which Python rejects as IndentationError on
        # the first non-comment line. The -c form is fork-clean and
        # indent-immune.
        shell: bash
        run: |
          set -euo pipefail
          PY_CHECK='
          import json, re, sys
          html = open("/tmp/page.html").read()
          m = re.search(r"<script[^>]+type=\"application/ld\+json\"[^>]*>(.*?)</script>", html, re.S)
          if not m:
              print("::error::regex failed to extract JSON-LD payload")
              sys.exit(1)
          payload = m.group(1).replace(r"<", "<")
          try:
              json.loads(payload)
          except Exception as e:
              print(f"::error::JSON-LD payload did not parse: {e}")
              sys.exit(1)
          '
          assert_jsonld() {
            local path="$1"
            curl -sf "$BASE$path" -o /tmp/page.html
            local count
            count=$(grep -c 'application/ld+json' /tmp/page.html || true)
            if [ "$count" -lt 1 ]; then
              echo "::error::$path emitted ZERO JSON-LD scripts (expected ≥1)"
              exit 1
            fi
            python3 -c "$PY_CHECK"
            echo "✓ $path: $count JSON-LD script(s), first one parses"
          }
          assert_jsonld /en
          assert_jsonld /en/for-agents

      - name: Assert ImageResponse renders non-empty bytes
        # This is the big one — the 2026-05-17 devIndicators:false
        # regression (and again the 2026-05-18 satori woff2 issue)
        # broke EVERY ImageResponse route to return 0 bytes. A
        # simple byte-size assertion catches it instantly.
        shell: bash
        run: |
          set -euo pipefail
          # Write to file first then wc — `curl | wc -c` triggers
          # the same SIGPIPE class on early wc completion under
          # pipefail.
          curl -sf "$BASE/en/opengraph-image" -o /tmp/og.png
          bytes=$(wc -c < /tmp/og.png)
          if [ "$bytes" -lt 1000 ]; then
            echo "::error::homepage opengraph-image is $bytes bytes (expected ≥ 1000) — ImageResponse likely broken"
            exit 1
          fi
          echo "✓ /en/opengraph-image rendered $bytes bytes"

      - name: Assert cron route auth gate (no bearer = 401)
        run: |
          set -euo pipefail
          status=$(curl -s -o /dev/null -w "%{http_code}" "$BASE/api/cron/audit-prune")
          # 503 = cron_secret_unconfigured (env var missing); 401 =
          # auth check working. Either way it's NOT 200.
          if [ "$status" = "503" ]; then
            echo "::error::cron route returned 503 — CRON_SECRET missing from prod env"
            exit 1
          fi
          [ "$status" = "401" ] || { echo "::error::cron route without auth returned $status (expected 401)"; exit 1; }
          echo "✓ /api/cron/audit-prune without auth → 401"

      - name: Assert cron route works with bearer
        if: ${{ env.CRON_SECRET != '' }}
        # Skip silently when the GH Actions secret hasn't been provisioned
        # yet — we still want the previous step to assert auth works.
        shell: bash
        run: |
          set -euo pipefail
          # Tiny response (< 1 KB), so the echo|python3 pipe is
          # SIGPIPE-safe in practice. But still using here-string
          # for consistency with the rest of the file.
          resp=$(curl -s -H "Authorization: Bearer $CRON_SECRET" "$BASE/api/cron/audit-prune")
          ok=$(python3 -c "import json,sys; print(json.load(sys.stdin).get('ok'))" <<< "$resp" 2>/dev/null || echo "parse-error")
          if [ "$ok" != "True" ]; then
            echo "::error::audit-prune with bearer returned non-ok: $resp"
            exit 1
          fi
          echo "✓ /api/cron/audit-prune with bearer → ok"

      - name: Assert robots.txt + sitemap.xml
        shell: bash
        run: |
          set -euo pipefail
          # Download to disk first, then check with bash native
          # matching — same pipefail/SIGPIPE rationale as above.
          curl -sf "$BASE/robots.txt" -o /tmp/robots.txt
          if ! grep -q 'Disallow: /api/' /tmp/robots.txt; then
            echo "::error::robots.txt missing /api/ disallow"
            exit 1
          fi
          curl -sfL "$BASE/sitemap.xml" -o /tmp/sm.xml
          [ -s /tmp/sm.xml ] || { echo "::error::sitemap.xml empty"; exit 1; }
          if ! head -c 100 /tmp/sm.xml | grep -q 'xml'; then
            echo "::error::sitemap.xml not XML"
            exit 1
          fi
          echo "✓ robots.txt + sitemap.xml healthy"

      - name: Assert /api/audit/start rejects malformed input
        run: |
          set -euo pipefail
          status=$(curl -s -o /dev/null -w "%{http_code}" -X POST -H 'content-type: application/json' --data '{}' "$BASE/api/audit/start")
          [ "$status" = "400" ] || { echo "::error::audit start with empty body returned $status (expected 400)"; exit 1; }
          echo "✓ /api/audit/start input validation intact"

      - name: Summary
        if: success()
        run: echo "::notice::Post-deploy smoke green for ${{ github.event.workflow_run.head_sha }}"
